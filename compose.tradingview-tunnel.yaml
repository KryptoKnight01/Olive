services:
  tradingview-ingress:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/tradingview-ingress.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || [ $$? -eq 8 ]"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tradingview-tunnel:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://tradingview-ingress:8080
    depends_on:
      tradingview-ingress:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
