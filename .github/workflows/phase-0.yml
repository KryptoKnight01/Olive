name: Olive acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Validate migration chain
        run: alembic upgrade head --sql > /tmp/olive-phase-0.sql

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      OLIVE_SIGNAL_HMAC_KEY_ID: tradingview-development
      OLIVE_SIGNAL_HMAC_SECRET: olive-phase2-ci-smoke-only
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the Olive stack
        run: docker compose up --build --detach --wait
      - name: Apply migrations
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check
      - name: Verify health contracts
        run: |
          curl --fail --show-error http://localhost:8000/health/live
          curl --fail --show-error http://localhost:8000/health/ready
      - name: Verify signed signal intake and replay protection
        run: |
          docker compose run --rm api python -m olive.smoke.phase2 seed
          docker compose run --rm api python -m olive.smoke.phase2 send
      - name: Capture diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
